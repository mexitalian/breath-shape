name: Android app

# Changes that can't affect the Android app (docs, tests, Claude settings, the other
# app's native code) don't build or publish a new release.
on:
  pull_request:
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'tests/**'
      - 'LICENSE'
      - 'src-tauri/**'
      - '.github/workflows/macos.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '**/*.md'
      - 'tests/**'
      - 'LICENSE'
      - 'src-tauri/**'
      - '.github/workflows/macos.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: write

# One build per branch at a time: a newer push cancels any build still running,
# so only the newest commit finishes and (on main) publishes the release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: breathing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish "Latest app build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk breathing.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest breathing.apk \
            --title "Latest app build" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes "Debug build of main at ${GITHUB_SHA::7} (build ${{ github.run_number }}).

          Install on Android: open this page on your phone, tap **breathing.apk**, then allow your browser to install apps when asked. It installs as **Breath Dev**, next to the Google Play version; new builds install over the old one."
